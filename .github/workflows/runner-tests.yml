name: Validate compute runner
on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/runner-tests.yml'
  pull_request:
    paths:
      - 'runner/**'
      - '.github/workflows/runner-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile runner/worker.py runner/prepare_job.py
      - name: Run runner unit tests
        run: python3 -m unittest discover -s runner/tests -v
      - name: Bash syntax check
        run: bash -n runner/install.sh
